<!DOCTYPE html>
<!--[if IE 8]> <html lang="en" class="ie8 no-js"> <![endif]-->
<!--[if IE 9]> <html lang="en" class="ie9 no-js"> <![endif]-->
<!--[if !IE]><!-->
<html lang="zxx" xmlns:th="http://www.thymeleaf.org">
<!--<![endif]-->
<!-- Begin Head -->

<head>
    <title>会议室管理</title>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="author" content="">
    <meta name="MobileOptimized" content="320">
    <!--Start Style -->
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/fonts.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/font-awesome.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/icofont.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/style.css}">
    <link rel="stylesheet" id="theme-change" type="text/css" href="">

    <script th:src="@{/static/js/api.js}"></script>
    <script th:src="@{/static/js/jquery.min.js}"></script>
</head>
<body>
<div class="loader">
    <div class="spinner">
        <img th:src="@{/static/picture/loader.gif}" alt="">
    </div>
</div>
<div class="page-wrapper">
    <div th:include="head.html::head-title(${authUser.getUsername()},${authUser.getRole()})"></div>
    <!-- Container Start -->
    <div class="page-wrapper">
        <div class="main-content">
            <!-- Page Title Start -->
            <div class="row">
                <div class="colxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                    <div class="page-title-wrapper">
                        <div class="page-title-box ad-title-box-use">
                         <h4 class="page-title">会议室管理</h4>
                        </div>
                        <div class="ad-breadcrumb">
                            <ul>
                               <li>
                                  <div>

                                    <a th:href="@{/page/admin/addMeetingRoom}">
                                    <i class="fas fa-sign-out-alt"></i> 增加会议室
                                    </a>
                                  </div>
                               </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

<!-- Products Orders Start -->
            <div class="row" >
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                    <div class="card chart-card">
                        <div class="card-header">
                          <h4 style="text-align:center">会议室信息</h4>
                        </div>
                    <div class="card-body pb-4">
                        <div class="chart-holder">
                            <div class="table-responsive">
                               <table class="table table-styled mb-0">
                               <thead>
                               <tr>
                                <th>房间 ID</th>
                                <th>房间名称</th>
                                <th>房间地址</th>
                                <th>房间内设备</th>
                                <th>房间最大容量</th>
                                <th>设备管理</th>
                                <th>action</th>
                               </tr>
                               </thead>
                               <tbody th:each="meetingRoom : ${meetingRooms}">
                                <tr>
                                <td th:text="${meetingRoom.getRID()}">#JH2033</td>
                                <td th:text="${meetingRoom.getName()}">#JH2033</td>
                                <td th:text="${meetingRoom.getAddress()}">#JH2033</td>
                                <td >
                                                <span class="row" >
                                                    <p th:each="device : ${meetingRoom.getDevices()}"  th:text="${device.getName()}+'&nbsp'" > </p>
                                                </span>
                                </td>
                                <td th:text="${meetingRoom.getMax_capacity()}">#JH2033</td>
                                <td class="relative">
                                    <a class="action-btn" th:href="@{/page/admin/showDevice/{rid}(rid=${meetingRoom.getRID()})}">
                                        <svg class="default-size " viewBox="0 0 341.333 341.333 ">
                                            <g>
                                                <g>
                                                    <g>
                                                        <path d="M170.667,85.333c23.573,0,42.667-19.093,42.667-42.667C213.333,19.093,194.24,0,170.667,0S128,19.093,128,42.667 C128,66.24,147.093,85.333,170.667,85.333z "></path>
                                                        <path d="M170.667,128C147.093,128,128,147.093,128,170.667s19.093,42.667,42.667,42.667s42.667-19.093,42.667-42.667 S194.24,128,170.667,128z "></path>
                                                        <path d="M170.667,256C147.093,256,128,275.093,128,298.667c0,23.573,19.093,42.667,42.667,42.667s42.667-19.093,42.667-42.667 C213.333,275.093,194.24,256,170.667,256z "></path>
                                                    </g>
                                                </g>
                                            </g>
                                        </svg>
                                    </a>
                                </td>
                                <td class="relative">
                                    <a class="action-btn" >
                                        <svg class="default-size " viewBox="0 0 341.333 341.333 ">
                                            <g>
                                                <g>
                                                    <g>
                                                        <path d="M170.667,85.333c23.573,0,42.667-19.093,42.667-42.667C213.333,19.093,194.24,0,170.667,0S128,19.093,128,42.667 C128,66.24,147.093,85.333,170.667,85.333z "></path>
                                                        <path d="M170.667,128C147.093,128,128,147.093,128,170.667s19.093,42.667,42.667,42.667s42.667-19.093,42.667-42.667 S194.24,128,170.667,128z "></path>
                                                        <path d="M170.667,256C147.093,256,128,275.093,128,298.667c0,23.573,19.093,42.667,42.667,42.667s42.667-19.093,42.667-42.667 C213.333,275.093,194.24,256,170.667,256z "></path>
                                                    </g>
                                                </g>
                                            </g>
                                        </svg>
                                    </a>
                                    <div class="action-option ">
                                        <ul>
                                            <li class="row">
                                                <a th:href="@{/page/admin/modify_meetingRoom/{rid}(rid=${meetingRoom.getRID()})}" ><i class="far fa-edit mr-2 "></i>修改</a>
                                            </li>
                                            <li class="row">
                                                <a th:href="@{/api/admin/deleteMeetingRoom/{rid}(rid=${meetingRoom.getRID()})}"><i class="far fa-trash-alt mr-2 "></i>删除</a>
                                            </li>
                                        </ul>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
            </div>
        </div>
    </div>
</div>
<!-- Script Start -->
<script th:src="@{/static/js/jquery.min.js}"></script>
<script th:src="@{/static/js/popper.min.js}"></script>
<script th:src="@{/static/js/bootstrap.min.js}"></script>
<script th:src="@{/static/js/swiper.min.js}"></script>
<script th:src="@{/static/js/apexcharts.min.js}"></script>
<script th:src="@{/static/js/control-chart-apexcharts.js}"></script>
<!-- Page Specific -->
<script th:src="@{/static/js/nice-select.min.js}"></script>
<!-- Custom Script -->
<script th:src="@{/static/js/custom.js}"></script>
</body>
</html>
