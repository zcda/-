<head>
    <meta charset="UTF-8">

    <meta name="MobileOptimized" content="320">
    <!--Start Style -->
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/fonts.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/font-awesome.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/icofont.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/style.css}">
    <link rel="stylesheet" id="theme-change" type="text/css" href="">

    <script th:src="@{/static/js/api.js}"></script>

<body>
<div class="loader">
    <div class="spinner">
        <img th:src="@{/static/picture/loader.gif}" alt="">
    </div>
</div>
<!-- Main Body -->
<div class="page-wrapper">
    <div th:include="head.html::head-title(${authUser.getUsername()},${authUser.getRole()})"></div>
    <div class="page-wrapper">
        <div class="main-content">
            <!-- Page Title Start -->


            <!-- Dashboard Start -->

            <!-- Revanue Status Start -->

            <!-- Products Orders Start -->
            <div class="row">
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                    <div class="card chart-card">
                        <div class="card-header">
                            <h4 style="text-align:center">人员详情</h4>
                        </div>
                        <div class="card-body pb-4">
                            <div class="chart-holder">
                                <div class="table-responsive">
                                    <table class="table table-styled mb-0">
                                        <thead>
                                        <tr>
                                            <th>用户id</th>
                                            <th>用户姓名</th>
                                            <th>性别</th>
                                            <th>电话信息</th>
                                            <th>组信息</th>

                                        </tr>
                                        </thead>

                                        <tr>
                                            <td th:text="${user.getUid()}">#JH2033</td>
                                            <td th:text="${user.getName()}">#JH2033</td>
                                            <td th:text="${user.getSex()}">#JH2033</td>
                                            <td th:text="${user.getPhoneNumber()}">#JH2033</td>
                                            <td >
                                                <span class="row">
                                                    <p th:each="group : ${user.getGroup()}" th:text="${group.getName()}"></p>
                                                </span>
                                            </td>

                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script Start -->
<script th:src="@{/static/js/jquery.min.js}"></script>
